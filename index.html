<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shield Vercel</title>
<style>
body{background:#0d1117;color:#fff;font-family:Arial;text-align:center;padding:20px}
.card{background:#161b22;padding:20px;border-radius:12px;max-width:500px;margin:20px auto;border:1px solid #30363d}
input{width:90%;padding:12px;border-radius:8px;border:none;margin:10px 0}
button{background:#238636;color:#fff;padding:12px 25px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
pre{text-align:left;direction:ltr;background:#0d1117;padding:15px;border-radius:8px;overflow:auto;margin-top:15px;white-space:pre-wrap}
</style>
</head>
<body>
<h2>🛡️ Shield Vercel</h2>
<div class="card">
<input type="text" id="url" placeholder="https://example.com">
<br>
<button onclick="scan()">فحص الآن 🔍</button>
<pre id="result">النتيجة هنا...</pre>
</div>
<script>
async function scan(){
let u=document.getElementById('url').value;
if(!u){alert('اكتب الرابط!');return}
document.getElementById('result').textContent='جاري الفحص...';
let r=await fetch('/api/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:u})});
let d=await r.text();
document.getElementById('result').textContent=d;
}
</script>
</body>
</html>
